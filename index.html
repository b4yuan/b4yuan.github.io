<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My 3D CV Museum</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #blocker {
            position: absolute; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8); z-index: 10;
        }
        #instructions {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; cursor: pointer;
        }

        /* NEW: Crosshair and Placard UI */
        /* UPGRADED: True Crosshair */
        #crosshair {
            position: fixed; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); z-index: 5; pointer-events: none;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(255, 255, 255, 0.9);
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 3px rgba(0,0,0,0.8); /* Ensures it stays visible on white walls */
        }
        #crosshair::before { width: 20px; height: 2px; } /* Horizontal line */
        #crosshair::after { width: 2px; height: 20px; }  /* Vertical line */
        #placard-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 20; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
        #placard-content {
            background: #fdfdfd; padding: 60px; max-width: 600px; text-align: right;
            border-right: 15px solid #2a2a2a; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        #placard-content h1 { margin: 0 0 10px 0; font-family: Arial, sans-serif; font-size: 45px; color: #111; }
        #placard-content h3 { margin: 0 0 25px 0; font-family: Georgia, serif; font-style: italic; color: #555; }
        #placard-content p { font-family: Arial, sans-serif; font-size: 22px; color: #333; line-height: 1.6; }
        #close-btn {
            margin-top: 40px; padding: 15px 30px; font-size: 18px; cursor: pointer;
            background: #111; color: white; border: none; font-weight: bold; float: right;
        }
        #close-btn:hover { background: #444; }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    
    <div id="placard-overlay">
        <div id="placard-content">
            <h1 id="ui-title">Title</h1>
            <h3 id="ui-material">Material</h3>
            <p id="ui-desc">Description</p>
            <button id="close-btn">Close & Resume</button>
        </div>
    </div>

    <div id="blocker">
        <div id="instructions">
            <h1>Click to Enter Kunsthaus Brian</h1>
            <p>Move: WASD | Look: Mouse</p>
            </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        const password = prompt("Please enter the password to view the gallery:");
        if (password !== "glenisawesome3000") {
            alert("Incorrect password.");
            window.location.href = "https://google.com"; // Redirect away
        }

        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;


        // --- NEW INTERACTIVITY VARIABLES ---
        const interactableObjects = []; 
        let isViewingArt = false;

        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // --- NEW COLLISION VARIABLES ---
        const collisionObjects = [];
        const raycaster = new THREE.Raycaster();
        const textureLoader = new THREE.TextureLoader(); // NEW: Loads our images!

        // Museum Configuration
        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.8 });
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
        const roomSize = 40;
        const wallHeight = 20;
        const doorWidth = 10;
        const doorHeight = 14;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);
            scene.fog = new THREE.Fog(0x111111, 0, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 10, 20); // Start at the front door

            // Lighting
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));
            
            // Generate the Museum layout
            buildMuseum();

            // Controls Setup
            controls = new PointerLockControls(camera, document.body);
            document.getElementById('instructions').addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => document.getElementById('blocker').style.display = 'none');
            // Only show the main menu if we aren't currently reading a placard
            controls.addEventListener('unlock', () => {
                if (!isViewingArt) document.getElementById('blocker').style.display = 'block';
            });
            scene.add(controls.getObject());

            // Key Listeners
            const onKeyDown = (e) => {
                if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = true;
                if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = true;
                if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = true;
                if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = true;
            };
            const onKeyUp = (e) => {
                if(e.code === 'KeyW' || e.code === 'ArrowUp') moveForward = false;
                if(e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft = false;
                if(e.code === 'KeyS' || e.code === 'ArrowDown') moveBackward = false;
                if(e.code === 'KeyD' || e.code === 'ArrowRight') moveRight = false;
            };
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- MUSEUM BUILDER FUNCTIONS ---

        function buildMuseum() {
            // 1. The Endless Hallway Floor
            const hallFloorGeo = new THREE.PlaneGeometry(30, 300);
            hallFloorGeo.rotateX(-Math.PI / 2);
            const hallFloor = new THREE.Mesh(hallFloorGeo, floorMaterial);
            hallFloor.position.z = -100;
            scene.add(hallFloor);

            // --- EDUCATION IMAGES ---
            // Note: The order is exactly how they map in your buildRoom function:
            // [0]: Partition Left (14x8) | [1]: Partition Right (14x8) 
            // [2]: Outer Wall 1 (4x6)    | [3]: Outer Wall 2 (4x6)
            
            // --- EDUCATION DATA ---
            // const eduData = [
            //     {
            //         url: 'images/education/ETH_UZH_Logo_crop.svg.png',
            //         title: 'ETH Zurich / Uni Zurich',
            //         material: 'Joint Master of Science',
            //         description: 'A rigorous joint degree program specializing in advanced computational concepts and systems engineering.'
            //     },
            //     {
            //         url: 'images/education/TU_Logo.svg.png', // Your custom TU Wien logo!
            //         title: 'TU Wien',
            //         material: 'Ph.D. Candidate',
            //         description: 'Currently pursuing a doctorate, contributing to cutting-edge research and pushing the boundaries of the field.'
            //     },
            //     {
            //         url: 'images/education/Purdue_University_seal.svg.png',
            //         title: 'Purdue University',
            //         material: 'B.Sc. in Computer Engineering',
            //         description: 'The foundation. Extensive coursework in hardware architecture, software development, and systems design.'
            //     },
            //     {
            //         url: 'https://placehold.co/400x600/2f3640/white?text=Awards',
            //         title: 'Academic Honors',
            //         material: 'Certificates & Publications',
            //         description: 'A collection of academic achievements, notable publications, and continuous recognition for excellence.'
            //     }
            // ];
            const museumConfig = [
                {
                    x: -35, z: -20, 
                    title: "Education",
                    side: 'left',
                    isFirstRoom: true,
                    isLastRoom: false,
                    art: [
                        {
                            wall: 'partition_front', pos: 'center', url: 'images/education/TU_Logo.svg.png', 
                            title: 'Technische Universität Wien', 
                            material: 'Ph.D. Candidate', 
                            desc: 'AI in Neuroscience' 
                        },
                        {
                            wall: 'partition_back', pos: 'center', url: 'images/education/ETH_UZH_Logo_crop.svg.png', 
                            title: 'ETH Zürich / University of Zürich', 
                            material: 'Joint M.Sc. in Neural Systems & Computation', 
                            desc: '...' 
                        },
                        {
                            wall: 'back', pos: 'center', url: 'images/education/Purdue_University_Logo.svg.png', 
                            title: 'Purdue', 
                            material: 'B.Sc. in Computer Engineering', 
                            desc: '...'
                        }
                    ],
                },
                {
                    x: -35, z: -60,
                    title: "Experience",
                    side: 'left',
                    isFirstRoom: false,
                    isLastRoom: true,
                    art: null
                }
            ];

            // Place Left Rooms (Pass the eduData array!)
            museumConfig.forEach(config => {
                buildRoom(config); // Pass the whole object
            });
            // buildRoom(-35, -60, 'Certifications', 'left', false, true, null);

            // // 3. Place Right Rooms
            // buildRoom(35, -20, 'Experience', 'right', true, false, null); 
            // buildRoom(35, -60, 'Projects', 'right', false, true, null); 
        }

        // Notice the last parameter is now 'images' (an array)
        function buildRoom({x, z, title, side, isFirstRoom, isLastRoom, art}) {

            const images = art;

            const roomGroup = new THREE.Group();
            roomGroup.position.set(x, 0, z);

            const halfSize = roomSize / 2;
            const wallThickness = 1;

            // 1. Room Floor
            const floorGeo = new THREE.PlaneGeometry(roomSize, roomSize);
            floorGeo.rotateX(-Math.PI / 2);
            roomGroup.add(new THREE.Mesh(floorGeo, floorMaterial));

            // 2. Outer Wall
            const outerWall = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, wallHeight, roomSize), wallMaterial);
            outerWall.position.set(side === 'left' ? -halfSize : halfSize, wallHeight/2, 0);
            roomGroup.add(outerWall);

            // 3. Inner Wall
            const hallwayWall = buildWallWithDoor(roomSize, wallHeight, wallThickness, doorWidth, doorHeight);
            hallwayWall.rotation.y = Math.PI / 2;
            hallwayWall.position.set(side === 'left' ? halfSize : -halfSize, 0, 0);
            roomGroup.add(hallwayWall);

            // 4. Front Wall
            let frontWall;
            if (isFirstRoom) {
                frontWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, wallHeight, wallThickness), wallMaterial);
                frontWall.position.set(0, wallHeight/2, halfSize);
            } else {
                frontWall = buildWallWithDoor(roomSize, wallHeight, wallThickness, doorWidth, doorHeight);
                frontWall.position.set(0, 0, halfSize);
            }
            roomGroup.add(frontWall);

            // 5. Back Wall
            let backWall;
            if (isLastRoom) {
                backWall = new THREE.Mesh(new THREE.BoxGeometry(roomSize, wallHeight, wallThickness), wallMaterial);
                backWall.position.set(0, wallHeight/2, -halfSize);
            } else {
                backWall = buildWallWithDoor(roomSize, wallHeight, wallThickness, doorWidth, doorHeight);
                backWall.position.set(0, 0, -halfSize);
            }
            roomGroup.add(backWall);

            // 6. Middle Partition
            const partitionLength = 16;
            const partitionHeight = 15;
            const partition = new THREE.Mesh(new THREE.BoxGeometry(wallThickness, partitionHeight, partitionLength), wallMaterial);
            partition.position.set(0, partitionHeight/2, 0);
            roomGroup.add(partition);

            // 7. HANG THE ARTWORK (Explicit Wall Placement)
            if (art && art.length > 0) {
                art.forEach(item => {
                    let xPos = 0, zPos = 0, rotY = 0;
                    let maxWidth = 12;
                    const half = halfSize - 0.6; // Slightly off the wall to prevent flickering

                    // A. Horizontal Position on the wall
                    // For Front/Back walls, 'pos' moves along X. For Partitions, 'pos' moves along Z.
                    let offset = 0;
                    if (item.pos === 'left') offset = -8;
                    else if (item.pos === 'right') offset = 8;

                    // B. Wall Mapping
                    if (item.wall === 'front') {
                        xPos = offset;
                        zPos = -roomSize;
                        rotY = 0; // Faces the entrance
                    } 
                    else if (item.wall === 'back') {
                        xPos = -half + offset;
                        zPos = 0;
                        rotY = Math.PI / 2; // Faces the back wall
                    } 
                    else if (item.wall === 'partition_front') {
                        // Side of partition facing the hallway
                        xPos = (side === 'left') ? 0.6 : -0.6;
                        zPos = offset;
                        rotY = Math.PI / 2; // Faces right if left room, left if right room
                    } 
                    else if (item.wall === 'partition_back') {
                        // Side of partition facing the outer wall
                        xPos = (side === 'left') ? -0.6 : 0.6;
                        zPos = offset;
                        rotY = - Math.PI / 2; // Same rotation as front since it's a thin wall
                    }

                    if (item.url) {
                        addArtPiece(roomGroup, xPos, 9, zPos, rotY, maxWidth, 8, item);
                    }
                });
            }

            // Signage
            const sign = createSign(title);
            sign.rotation.y = side === 'left' ? Math.PI / 2 : -Math.PI / 2;
            sign.position.set(side === 'left' ? halfSize + 0.6 : -halfSize - 0.6, doorHeight + 2, 0);
            roomGroup.add(sign);

            const roomLight = new THREE.PointLight(0xffeedd, 0.2, 100);
            roomLight.position.set(0, wallHeight - 2, 0);
            roomGroup.add(roomLight);

            collisionObjects.push(outerWall, hallwayWall, frontWall, backWall, partition);
            scene.add(roomGroup);
        }

        // UPGRADED: Dynamically sizes the 3D canvas to perfectly match the photo
        function addArtPiece(parent, x, y, z, rotationY, maxWidth, maxHeight, artData) {
            
            const { url, title, material, description } = artData || {};

            // Helper function that builds everything once we know the final dimensions
            function buildConstruct(finalWidth, finalHeight, artMat) {
                // --- 1. THE ARTWORK (Thickest) ---
                const artGeo = new THREE.BoxGeometry(finalWidth, finalHeight, 0.4); 
                const artMesh = new THREE.Mesh(artGeo, artMat);
                artMesh.position.set(x, y, z);
                artMesh.rotation.y = rotationY;
                
                // Tag it with data so the clicker knows what to display!
                artMesh.userData = { isArt: true, title, material, description };
                parent.add(artMesh);
                if (title) interactableObjects.push(artMesh); 

                // --- 2a. THE CREAM MATBOARD (Wider Border) ---
                // We add 1.5 units to make the cream border much more prominent
                const matGeo = new THREE.BoxGeometry(finalWidth + 1.5, finalHeight + 1.5, 0.3);
                const matMat = new THREE.MeshStandardMaterial({ color: 0xf5f5dc }); // Cream color
                const matMesh = new THREE.Mesh(matGeo, matMat);
                matMesh.position.set(x, y, z);
                matMesh.rotation.y = rotationY;
                matMesh.userData = artMesh.userData; // Pass the same data
                parent.add(matMesh);
                if (title) interactableObjects.push(matMesh);

                // --- 2b. THE OUTER FRAME (Adjusted to wrap the wider matboard) ---
                // We add 1.8 units so the frame tightly hugs the new, larger matboard
                const frameGeo = new THREE.BoxGeometry(finalWidth + 1.8, finalHeight + 1.8, 0.2);
                const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
                const frameMesh = new THREE.Mesh(frameGeo, frameMat);
                frameMesh.position.set(x, y, z); 
                frameMesh.rotation.y = rotationY;
                frameMesh.userData = artMesh.userData; // Pass the same data
                parent.add(frameMesh);
                if (title) interactableObjects.push(frameMesh);

                // --- 3. ELEGANT BRASS PICTURE LIGHT (Single, Warm Source) ---
                const lightY = y + (finalHeight / 2) + 1.6; 
                
                const fixtureGroup = new THREE.Group();
                fixtureGroup.position.set(x, lightY, z);
                fixtureGroup.rotation.y = rotationY;
                parent.add(fixtureGroup);

                const brassMat = new THREE.MeshStandardMaterial({ 
                    color: 0xd4af37, metalness: 0.8, roughness: 0.2 
                });

                // A. Wall Mount
                const mountGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16);
                mountGeo.rotateX(Math.PI / 2);
                const mountMesh = new THREE.Mesh(mountGeo, brassMat);
                mountMesh.position.set(0, 0, 0.2); 
                fixtureGroup.add(mountMesh);

                // B. Arm
                const armGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.6, 8);
                armGeo.rotateX(Math.PI / 2);
                const armMesh = new THREE.Mesh(armGeo, brassMat);
                armMesh.position.set(0, 0, 0.5); 
                fixtureGroup.add(armMesh);

                // C. Tube (Still scales dynamically with art width)
                const tubeWidth = Math.max(1.5, finalWidth * 0.6); 
                const tubeGeo = new THREE.CylinderGeometry(0.08, 0.08, tubeWidth, 16);
                tubeGeo.rotateZ(Math.PI / 2);
                const tubeMesh = new THREE.Mesh(tubeGeo, brassMat);
                tubeMesh.position.set(0, 0, 0.8); 
                fixtureGroup.add(tubeMesh);

                // D. TRUE LINEAR LIGHT SOURCE (LED Strip)
                const warmColor = 0xffd6aa; 
                
                // RectAreaLight(color, intensity, width, height)
                // We make it exactly the width of the brass tube, but very thin!
                // Note: Intensity scales differently here. 5 is a good starting point.
                const stripLight = new THREE.RectAreaLight(warmColor, 100.0, tubeWidth, 0.08); 
                
                // Position it just barely underneath the brass tube so it isn't blocked
                stripLight.position.set(0, -0.05, 0.8); 
                
                // Aim the flat, glowing face of the strip directly down at the canvas
                stripLight.lookAt(0, -20, 0); 
                
                fixtureGroup.add(stripLight);


                // --- 4. HANG THE PLACARD (Restored!) ---
                if (title) {
                    const pWidth = 1.6;   
                    const pHeight = 1.2; 
                    
                    // Recalculate global rotation vectors for the placard
                    const normalX = Math.sin(rotationY);
                    const normalZ = Math.cos(rotationY);
                    const spreadX = Math.cos(rotationY);
                    const spreadZ = -Math.sin(rotationY);

                    // Shift right to align with the wider frame
                    const localRightOffset = (finalWidth / 2) + 0.9 - (pWidth / 2);
                    const pNormalOffset = 0.26; 

                    const placardMesh = createPlacard(title, material, description, pWidth, pHeight);
                    
                    // Push down to clear the bottom of the wider frame
                    placardMesh.position.set(
                        x + (normalX * pNormalOffset) + (spreadX * localRightOffset),
                        y - (finalHeight / 2) - (pHeight / 2) - 1.3, 
                        z + (normalZ * pNormalOffset) + (spreadZ * localRightOffset)
                    );
                    
                    placardMesh.rotation.y = rotationY;
                    
                    // Make the placard itself clickable
                    placardMesh.userData = { isArt: true, title, material, description };
                    interactableObjects.push(placardMesh);
                    
                    parent.add(placardMesh);
                }
            } // <-- This is the closing bracket for buildConstruct()

            // --- LOAD IMAGE AND CALCULATE DIMENSIONS ---
            // --- LOAD IMAGE AND CALCULATE DIMENSIONS ---
            if (url) {
                textureLoader.load(url, function(texture) {
                    const imageAspect = texture.image.width / texture.image.height;
                    const boxAspect = maxWidth / maxHeight;

                    let finalWidth, finalHeight;

                    if (imageAspect > boxAspect) {
                        finalWidth = maxWidth;
                        finalHeight = maxWidth / imageAspect;
                    } else {
                        finalHeight = maxHeight;
                        finalWidth = maxHeight * imageAspect;
                    }

                    // NEW: The PNG Fix! 
                    // We bake the image onto a white background to prevent black glitches
                    const canvas = document.createElement('canvas');
                    canvas.width = texture.image.width;
                    canvas.height = texture.image.height;
                    const ctx = canvas.getContext('2d');
                    
                    // 1. Paint a solid white canvas
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 2. Stamp the transparent image on top
                    ctx.drawImage(texture.image, 0, 0);
                    
                    // 3. Turn our new white-backed image into a Three.js Texture
                    const solidTexture = new THREE.CanvasTexture(canvas);
                    solidTexture.colorSpace = THREE.SRGBColorSpace; 
                    
                    const artMat = new THREE.MeshStandardMaterial({ 
                        map: solidTexture, 
                        roughness: 0.3,
                        color: 0xffffff 
                    });
                    
                    buildConstruct(finalWidth, finalHeight, artMat);
                });
            } else {
                // Fallback if no image URL is provided
                const fallbackMat = new THREE.MeshStandardMaterial({ 
                    color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
                    roughness: 0.3 
                });
                buildConstruct(maxWidth, maxHeight, fallbackMat);
            }
        }

        // NEW: Generates a 3D Museum Placard
        function createPlacard(title, material, description, worldWidth, worldHeight) {
            const canvas = document.createElement('canvas');
            // Make the canvas high-resolution so text is crisp
            canvas.width = 1024; 
            canvas.height = 768;
            const context = canvas.getContext('2d');

            // 1. Card Background
            context.fillStyle = '#fdfdfd';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Setup Alignment
            context.textAlign = 'right';
            context.textBaseline = 'top';
            const padding = 60;
            const rightEdge = canvas.width - padding;
            let currentY = 50;

            // 3. Draw Title (Bold, Large)
            context.font = 'bold 65px Arial, sans-serif';
            context.fillStyle = '#111111';
            context.fillText(title || 'Untitled', rightEdge, currentY);
            currentY += 80;

            // 4. Draw Material (Italic, Medium)
            context.font = 'italic 45px Georgia, serif';
            context.fillStyle = '#555555';
            context.fillText(material || '', rightEdge, currentY);
            currentY += 90;

            // 5. Draw Description (Standard, Smaller, Auto-Wrapping)
            context.font = '40px Arial, sans-serif';
            context.fillStyle = '#333333';
            const maxWidth = canvas.width - (padding * 2);
            const lineHeight = 55;

            // Simple text wrapping logic
            const words = (description || '').split(' ');
            let line = '';
            for (let i = 0; i < words.length; i++) {
                const testLine = line + words[i] + ' ';
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    context.fillText(line, rightEdge, currentY);
                    line = words[i] + ' ';
                    currentY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, rightEdge, currentY); // Draw the last line

            // 6. Convert to Three.js Texture
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // Keeps text sharp at angles

            // 7. Create the 3D Object
            const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.8 });
            const geo = new THREE.PlaneGeometry(worldWidth, worldHeight);
            return new THREE.Mesh(geo, mat);
        }

        function buildWallWithDoor(width, height, depth, dWidth, dHeight) {
            const wallGroup = new THREE.Group();
            const sideWidth = (width - dWidth) / 2;
            
            // Left piece
            const leftMesh = new THREE.Mesh(new THREE.BoxGeometry(sideWidth, height, depth), wallMaterial);
            leftMesh.position.set(-width/2 + sideWidth/2, height/2, 0);
            wallGroup.add(leftMesh);

            // Right piece
            const rightMesh = new THREE.Mesh(new THREE.BoxGeometry(sideWidth, height, depth), wallMaterial);
            rightMesh.position.set(width/2 - sideWidth/2, height/2, 0);
            wallGroup.add(rightMesh);

            // Top piece (Lintel)
            const topHeight = height - dHeight;
            const topMesh = new THREE.Mesh(new THREE.BoxGeometry(dWidth, topHeight, depth), wallMaterial);
            topMesh.position.set(0, height - topHeight/2, 0);
            wallGroup.add(topMesh);

            return wallGroup;
        }

        function createSign(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#222'; // Dark plaque
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold 50px sans-serif';
            ctx.fillStyle = '#ffffff'; // White text
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshBasicMaterial({ map: texture });
            return new THREE.Mesh(new THREE.PlaneGeometry(12, 3), material);
        }

        // --- CLICK INTERACTION LOGIC ---
        document.addEventListener('mousedown', (event) => {
            // Only fire if we are walking around (locked)
            if (controls.isLocked) {
                // Shoot a laser from the exact center of the screen
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                
                // Check if it hit any of our art pieces
                const intersects = raycaster.intersectObjects(interactableObjects, false);
                
                // If we hit something and are close enough to it (distance < 20)
                if (intersects.length > 0 && intersects[0].distance < 20) {
                    const data = intersects[0].object.userData;
                    
                    if (data.title) {
                        // 1. Populate the HTML
                        document.getElementById('ui-title').innerText = data.title;
                        document.getElementById('ui-material').innerText = data.material;
                        document.getElementById('ui-desc').innerText = data.description;
                        
                        // 2. Set flags and show UI
                        isViewingArt = true;
                        document.getElementById('placard-overlay').style.display = 'flex';
                        
                        // 3. Freeze the game and release mouse cursor
                        controls.unlock();
                    }
                }
            }
        });

        // Close Button Logic
        document.getElementById('close-btn').addEventListener('click', () => {
            document.getElementById('placard-overlay').style.display = 'none';
            isViewingArt = false;
            controls.lock(); // Re-lock the mouse and keep playing!
        });

        // --- ANIMATION LOOP ---

        // --- ANIMATION LOOP ---

        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;
                
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

                // --- COLLISION DETECTION START ---
                
                // 1. Get the camera's current forward and right directions
                const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).setY(0).normalize();
                const camForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).setY(0).normalize();

                const collisionDistance = 4.0; // How close we can get to a wall before stopping

                // 2. Check X-Axis Movement (Strafing Left/Right)
                if (Math.abs(velocity.x) > 0) {
                    // Shoot a laser left or right depending on velocity
                    const dirX = camRight.clone().multiplyScalar(-Math.sign(velocity.x));
                    raycaster.set(camera.position, dirX);
                    
                    // Check for hits (true = check inside grouped door walls)
                    const hits = raycaster.intersectObjects(collisionObjects, true); 
                    if (hits.length > 0 && hits[0].distance < collisionDistance) {
                        velocity.x = 0; // Hit a wall! Stop X movement.
                    }
                }

                // 3. Check Z-Axis Movement (Walking Forward/Backward)
                if (Math.abs(velocity.z) > 0) {
                    // Shoot a laser forward or backward depending on velocity
                    const dirZ = camForward.clone().multiplyScalar(-Math.sign(velocity.z));
                    raycaster.set(camera.position, dirZ);
                    
                    const hits = raycaster.intersectObjects(collisionObjects, true);
                    if (hits.length > 0 && hits[0].distance < collisionDistance) {
                        velocity.z = 0; // Hit a wall! Stop Z movement.
                    }
                }
                // --- COLLISION DETECTION END ---

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }
            
            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
